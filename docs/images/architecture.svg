<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#21496b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="850" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Boundary Box -->
  <rect x="20" y="20" width="810" height="380" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="40" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">PGWIRE-MOCK CORE ARCHITECTURE</text>

  <!-- Left: Client Box -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="180" height="270" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="50" y="90" width="180" height="40" rx="10" fill="#334155" />
    <text x="75" y="115" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Database Clients</text>
    
    <rect x="65" y="145" width="150" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="168" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">psql CLI</text>

    <rect x="65" y="195" width="150" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="218" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Node.js (pg / Drizzle)</text>

    <rect x="65" y="245" width="150" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="268" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Go (pgx / database)</text>

    <rect x="65" y="295" width="150" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="80" y="318" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">Python (psycopg)</text>
  </g>

  <!-- Connectors -->
  <line x1="230" y1="160" x2="310" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="308,155 318,160 308,165" fill="#38bdf8" />
  <text x="240" y="150" fill="#94a3b8" font-family="monospace" font-size="11">TCP:5432</text>

  <!-- Middle: Engine Box -->
  <g filter="url(#shadow)">
    <rect x="320" y="90" width="280" height="270" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="320" y="90" width="280" height="40" rx="10" fill="url(#accentGrad)" />
    <text x="360" y="115" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">PGWire Socket Engine</text>

    <!-- Sub components inside engine -->
    <rect x="340" y="145" width="240" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="355" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Protocol 3.0 Parser</text>
    <text x="355" y="178" fill="#64748b" font-family="sans-serif" font-size="10">SSL, Startup, Simple &amp; Extended Q</text>

    <rect x="340" y="198" width="240" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="355" y="218" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Rule Matcher &amp; Cache</text>
    <text x="355" y="231" fill="#64748b" font-family="sans-serif" font-size="10">Normalized SQL, Regex, $1 Params</text>

    <rect x="340" y="250" width="240" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="355" y="270" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Fault &amp; Chaos Simulator</text>
    <text x="355" y="283" fill="#64748b" font-family="sans-serif" font-size="10">Latency, Jitter, SQLSTATE Error</text>

    <rect x="340" y="302" width="240" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="355" y="322" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Traffic Recorder (.pgtape)</text>
    <text x="355" y="335" fill="#64748b" font-family="sans-serif" font-size="10">Offline playback for CI runners</text>
  </g>

  <!-- Connectors to Right -->
  <line x1="600" y1="225" x2="650" y2="225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="648,220 658,225 648,230" fill="#38bdf8" />
  <text x="606" y="215" fill="#94a3b8" font-family="monospace" font-size="11">HTTP:8080</text>

  <!-- Right: Admin and Storage -->
  <g filter="url(#shadow)">
    <rect x="660" y="90" width="140" height="270" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    <rect x="660" y="90" width="140" height="40" rx="10" fill="#334155" />
    <text x="680" y="115" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Admin &amp; Assert</text>

    <rect x="670" y="150" width="120" height="45" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" />
    <text x="682" y="172" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">POST /api/assert</text>
    <text x="682" y="186" fill="#64748b" font-family="sans-serif" font-size="9">Test verifications</text>

    <rect x="670" y="210" width="120" height="45" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
    <text x="682" y="232" fill="#a78bfa" font-family="sans-serif" font-size="11" font-weight="600">POST /api/rules</text>
    <text x="682" y="246" fill="#64748b" font-family="sans-serif" font-size="9">Dynamic injection</text>

    <rect x="670" y="270" width="120" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="682" y="292" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">GET /metrics</text>
    <text x="682" y="306" fill="#64748b" font-family="sans-serif" font-size="9">Prometheus metrics</text>
  </g>
</svg>
